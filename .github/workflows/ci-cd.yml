name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test

  build-and-release:
    name: Build APK & Publish Release
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file for build
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_SUPABASE_PROJECT_URL=https://wbvfmnytnsmcghmfvepc.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_URL=sb_publishable_6UmEjoSZvNx3ErD-tM1-CQ_sGI-2X29
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=1089752702487-55ekq1ol4mu6kc0nveo8pk58uktumm12.apps.googleusercontent.com
          EOF

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${PKG_VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APK with EAS
        id: eas_build
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          cat build.json
          APK_URL=$(node -e "
            const fs = require('fs');
            try {
              const raw = fs.readFileSync('./build.json', 'utf8');
              const jsonStart = raw.indexOf('{');
              const jsonArrayStart = raw.indexOf('[');
              const startIdx = (jsonArrayStart !== -1 && (jsonStart === -1 || jsonArrayStart < jsonStart)) ? jsonArrayStart : jsonStart;
              const jsonStr = raw.substring(startIdx);
              const data = JSON.parse(jsonStr);
              const item = Array.isArray(data) ? data[0] : data;
              const url = item?.artifacts?.applicationArchiveUrl || item?.artifacts?.buildUrl || '';
              console.log(url);
            } catch (e) {
              console.error(e);
            }
          ")
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          TAG="${{ steps.release_info.outputs.tag }}"
          if [ -n "$APK_URL" ]; then
            echo "Downloading APK to Nummo-${TAG}.apk from: $APK_URL"
            curl -L -o "./Nummo-${TAG}.apk" "$APK_URL"
            ls -la ./Nummo-*.apk
          else
            echo "No direct APK binary URL found in build.json output"
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Release ${{ steps.release_info.outputs.tag }}
          body: |
            ## Nummo Android APK Release
            - ✅ 101 tests unitarios pasando
            - ✅ Base de datos SQLite offline-first
            - ✅ Bloqueo biométrico y contraseñas cifradas
            - ✅ Sincronización en la nube con Supabase y Google Sign-In
            
            Descarga el archivo APK adjunto para instalar Nummo en tu dispositivo Android.
          files: ./Nummo-*.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
